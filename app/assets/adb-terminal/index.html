<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #161a22; }
    body { position: relative; }
    #terminal { position: absolute; top: 8px; left: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
    #terminal-viewport { position: absolute; top: 8px; left: 8px; overflow: hidden; }
    #terminal { top: 0; left: 0; transform-origin: top left; }
    #host-prompt { position: absolute; left: 8px; right: 8px; top: 8px; overflow: hidden; background: #161a22;
      white-space: pre; color: #e2e7ef; font-family: monospace; font-size: 14px; line-height: 1.3; }
    #host-prompt[hidden] { display: none; }
    #prompt-label { color: #78d9ec; }
    #prompt-caret { border-left: 1px solid #a8c7fa; }
    #selection-tools { position: absolute; z-index: 30; top: 8px; right: 8px; display: flex;
      background: #293447; border-radius: 18px; padding: 2px; }
    #selection-tools[hidden], .selection-handle[hidden] { display: none; }
    #selection-tools button { border: 0; background: transparent; color: #d4e3ff; padding: 10px 14px; }
    .selection-handle { position: absolute; z-index: 31; width: 28px; height: 28px; border: 0;
      border-radius: 50%; background: #a8c7fa; transform: translate(-50%, -30%); touch-action: none; }
    #host-prompt.selected { background: #405475; }
    .xterm-viewport { overscroll-behavior: contain; }
    #latest { position: absolute; right: 16px; bottom: 12px; border: 0; border-radius: 20px;
      padding: 10px 16px; background: #a8c7fa; color: #161a22; font-size: 13px; }
  </style>
</head>
<body>
  <div id="terminal-viewport"><div id="terminal"></div></div>
  <div id="host-prompt" hidden><span id="prompt-label">AndVM $ </span><span id="prompt-before"></span><span id="prompt-caret"></span><span id="prompt-after"></span></div>
  <button id="latest" hidden>↓ 最新输出</button>
  <div id="selection-tools" hidden><button id="selection-copy">复制</button><button id="selection-all">全选</button><button id="selection-close">取消</button></div>
  <button class="selection-handle" id="selection-start" aria-label="选择起点" hidden></button>
  <button class="selection-handle" id="selection-end" aria-label="选择终点" hidden></button>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
